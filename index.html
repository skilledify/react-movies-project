<!DOCTYPE html>
<html lang="ru" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<!-- Favicon: SVG (адаптируется под тему ОС), ICO (fallback), PNG для всех вкладок/устройств -->
		<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="./favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="48x48" href="./favicon-48x48.png" />
		<link rel="icon" type="image/png" sizes="96x96" href="./favicon-96x96.png" />
		<link rel="shortcut icon" href="./favicon.ico" />
		<link rel="mask-icon" href="./mask-icon.svg" color="#e94560" />
		<!-- Apple touch icons: светлая и тёмная темы (Safari 18+ поддерживает media) -->
		<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
		<link rel="apple-touch-icon" media="(prefers-color-scheme: dark)" href="./apple-touch-icon-dark.png" />
		<link rel="apple-touch-icon" media="(prefers-color-scheme: light)" href="./apple-touch-icon-light.png" />
		<!-- PWA / установка приложения -->
		<link rel="manifest" href="./manifest.json" />
		<meta name="msapplication-config" content="./browserconfig.xml" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="React Movies" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
		<meta
			name="description"
			content="React Movies — каталог фильмов и сериалов: поиск по названию, фильтры по типу и году, рейтинги, избранное и тёмная/светлая тема."
		/>
		<meta name="keywords" content="фильмы, сериалы, каталог, поиск, IMDb, OMDb, React" />
		<meta name="author" content="skilledify" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="React Movies — фильмы и сериалы" />
		<meta
			property="og:description"
			content="Каталог фильмов и сериалов: поиск, фильтры, рейтинги и избранное в современном интерфейсе."
		/>
		<meta property="og:image" content="./logo192.png" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="React Movies — фильмы и сериалы" />
		<meta
			name="twitter:description"
			content="Каталог фильмов и сериалов: поиск, фильтры, рейтинги и избранное."
		/>
		<link rel="apple-touch-icon" href="./logo192.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/icon?family=Material+Icons"
			rel="stylesheet"
		/>
		<title>React Movies — фильмы и сериалы</title>
	</head>

	<body>
		<noscript>Для работы приложения необходимо включить JavaScript.</noscript>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
